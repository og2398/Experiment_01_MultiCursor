<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Social Media Link Preview Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://multicursor.onrender.com/" />
    <meta property="og:title" content="Multi Cursor" />
    <meta
      property="og:description"
      content="See real-time visitors from around the world represented by live colored arrows!"
    />
    <meta
      property="og:image"
      content="https://multicursor.onrender.com/assets/Thumbnail.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter / X Preview Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Multi Cursor — Real-Time Visitor Radar"
    />
    <meta
      name="twitter:description"
      content="See real-time visitors from around the world represented by live colored arrows!"
    />
    <meta
      name="twitter:image"
      content="https://multicursor.onrender.com/assets/Thumbnail.png"
    />
    <title>Multi Cursor</title>
    <!-- Inter Font -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/geist@1.3.0/dist/fonts/inter/style.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app">
      <!-- Top-Left Visitor Counter -->
      <header class="hud-left">
        <h1 class="title">Multi Cursor</h1>
        <p class="stat">Active visitors: <span id="active-count">01</span></p>
      </header>

      <!-- Top-Right Short Country List -->
      <aside class="hud-right">
        <div id="country-list"></div>
      </aside>

      <!-- Cursor Canvas Overlay -->
      <div id="cursor-container"></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
  </body>
</html>
