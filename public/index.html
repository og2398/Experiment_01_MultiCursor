<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- 1. Standard Page Title (Fixes "Page title is short") -->
    <title>Multi Cursor — Live Real-Time Global Visitor Radar</title>

    <!-- 2. Standard Meta Description (Fixes "Meta description is missing") -->
    <meta
      name="description"
      content="An interactive real-time website where active global visitors are represented as live colored arrows with country tracking."
    />

    <!-- 3. Site Name (Fixes "Site name is missing") -->
    <meta property="og:site_name" content="Multi Cursor" />

    <!-- Open Graph / Facebook / WhatsApp Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://multicursor.onrender.com/" />
    <meta property="og:title" content="Multi Cursor" />
    <meta
      property="og:description"
      content="An interactive real-time website where active global visitors are represented as live colored arrows with country tracking."
    />

    <!-- 4. Image Meta Tags (Fixes "Image is missing") -->
    <meta
      property="og:image"
      content="https://multicursor.onrender.com/assets/Thumbnail.png"
    />
    <meta
      property="og:image:secure_url"
      content="https://multicursor.onrender.com/assets/Thumbnail.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Multi Cursor Live Preview" />

    <!-- Twitter / X Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Multi Cursor" />
    <meta
      name="twitter:description"
      content="An interactive real-time website where active global visitors are represented as live colored arrows with country tracking."
    />
    <meta
      name="twitter:image"
      content="https://multicursor.onrender.com/assets/Thumbnail.png"
    />

    <!-- Geist Font & Styles -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/geist@1.3.0/dist/fonts/geist-sans/style.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app">
      <!-- Top-Left Visitor Counter -->
      <header class="hud-left">
        <h1 class="title">Multi Cursor</h1>
        <p class="stat">Active visitors: <span id="active-count">01</span></p>
      </header>

      <!-- Top-Right Short Country List -->
      <aside class="hud-right">
        <div id="country-list"></div>
      </aside>

      <!-- Cursor Canvas Overlay -->
      <div id="cursor-container"></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
  </body>
</html>
